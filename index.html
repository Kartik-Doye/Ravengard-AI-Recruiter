    <script>
      // Gracefully handle benign Vite HMR disconnection notices without altering standard browser APIs
      (function() {
        if (typeof window !== 'undefined') {
          var origError = console.error;
          var isWsError = function(msg) {
            if (!msg) return false;
            var s = String(msg).toLowerCase();
            return (
              s.indexOf('failed to connect to websocket') !== -1 ||
              s.indexOf('[vite] failed to connect to websocket') !== -1
            );
          };

          console.error = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isWsError(arguments[i])) return;
            }
            return origError.apply(console, arguments);
          };
        }
      })();
    </script>
