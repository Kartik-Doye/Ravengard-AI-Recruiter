    <title>Ravengard AI Recruiter</title>

    <meta property="og:title" content="Ravengard AI Recruiter" />
    <meta property="og:description" content="An AI-conducted mock interview platform that acts as a definitive first-pass candidate filter." />
    <script>
      // Suppress benign Vite HMR websocket disconnection errors in AI Studio iframe container
      (function() {
        var origError = console.error;
        var origWarn = console.warn;
        var isWsError = function(msg) {
          if (!msg) return false;
          var s = String(msg).toLowerCase();
          return (
            s.indexOf('websocket') !== -1 ||
            s.indexOf('failed to connect to websocket') !== -1 ||
            s.indexOf('[vite] failed to connect') !== -1 ||
            s.indexOf('closed without opened') !== -1 ||
            s.indexOf('vite hmr') !== -1
          );
        };

        console.error = function() {
          var str = Array.prototype.join.call(arguments, ' ');
          if (isWsError(str)) {
            return;
          }
          return origError.apply(console, arguments);
        };
        console.warn = function() {
          var str = Array.prototype.join.call(arguments, ' ');
          if (isWsError(str)) {
            return;
          }
          return origWarn.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function (event) {
          var msg = (event && (event.message || String(event))) || '';
          if (isWsError(msg)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
