# Ravengard AI Recruiter — CI Pipeline
#
# Root cause of @tailwindcss/oxide failures:
#   npm has a long-standing bug where optional native binaries are not always
#   installed for the current platform (npm/cli#4828). The fix is to:
#     1. Delete package-lock.json & node_modules before installing so npm
#        performs a fresh resolution and downloads the correct .node binary.
#     2. Set CI=true (already true on GitHub runners) — vite.config.ts reads
#        this and skips @tailwindcss/vite, falling back to PostCSS instead.
#   This guarantees a hermetic build regardless of the lock-file state.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # ── Clean install ──────────────────────────────────────────────────────
      # Deleting package-lock.json + node_modules forces npm to re-resolve all
      # optional native dependencies (including @tailwindcss/oxide-linux-x64-gnu)
      # from scratch, bypassing the npm optional-dep caching bug.
      - name: Clean previous install artefacts
        run: |
          rm -f package-lock.json
          rm -rf node_modules

      - name: Install dependencies (fresh, with optional platform binaries)
        run: npm install --include=optional

      # ── Type safety gate ───────────────────────────────────────────────────
      - name: TypeScript type check
        run: npx tsc --noEmit

      # ── Production build ───────────────────────────────────────────────────
      # CI=true is already set by the GitHub runner; vite.config.ts detects it
      # and skips the @tailwindcss/vite oxide plugin, using PostCSS instead.
      - name: Build production bundle
        run: npm run build

      # ── Test suite ─────────────────────────────────────────────────────────
      - name: Run tests
        run: npm test
        env:
          # Vitest needs a minimal env; skip DB-dependent tests in CI
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
